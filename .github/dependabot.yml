version: 2
updates:
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - gradle
  commit-message:
    prefix: chore
    include: scope
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  - dependency-name: org.jetbrains.kotlin*
  - dependency-name: com.google.devtools.ksp
  - dependency-name: com.android.application
  - dependency-name: gradle
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
  groups:
    github-actions:
      patterns:
      - '*'
